<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾는 페이지가 없습니다 | 윤성조</title>
  <meta name="description" content="요청하신 페이지가 삭제되었거나 주소가 변경되었습니다.">
  <meta name="theme-color" content="#F7F4EE">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F7F4EE;
      color: #14213D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
      line-height: 1.7;
      word-break: keep-all;
    }
    .error-container {
      max-width: 480px;
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #E2DDD3;
      border-radius: 12px;
      padding: 3rem 2rem;
    }
    .error-code {
      font-size: 4rem;
      font-weight: 800;
      color: #C8553D;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #14213D;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      font-size: 1rem;
      color: #5B6475;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #14213D;
      color: #F7F4EE;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #C8553D;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">찾는 페이지가 없습니다</h1>
    <p class="error-desc">요청하신 페이지가 삭제되었거나 주소가 변경되었습니다.</p>
    <a href="https://seongjoyoun.github.io/portfolio/" class="btn">메인으로</a>
  </div>
</body>
</html>
